<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bersihinihh. — Purwarupa</title>
<style>
:root{font-family:Inter,Arial,sans-serif;color:#172521;background:#eff2ef}*{box-sizing:border-box}body{margin:0}.app{max-width:420px;min-height:100dvh;background:#fff;margin:auto;display:flex;flex-direction:column;box-shadow:0 0 30px #0001}.top{padding:21px 22px 4px;display:flex;justify-content:space-between;align-items:center}.brand{font-weight:900;letter-spacing:-.5px}.count{font-size:11px;color:#84918b}.main{flex:1;padding:12px 22px 25px}.back{border:1px solid #e3e8e5;background:white;border-radius:50%;width:26px;height:26px;margin-right:7px;cursor:pointer}.screen-title{font-size:12px;font-weight:800}.headline{font-size:25px;line-height:1.1;letter-spacing:-1px;margin:15px 0 9px}.muted{font-size:12px;line-height:1.55;color:#75837d}.section{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;margin:19px 0 9px;color:#52645c}.promo,.info{background:#e5f2ee;padding:13px;border-radius:8px;font-size:11px;line-height:1.5;color:#315c53}.promo b{display:block;color:#23423a}.item,.option,.input{border:1px solid #e0e6e2;background:white;border-radius:8px}.item{display:flex;justify-content:space-between;align-items:center;width:100%;padding:14px 12px;text-align:left;margin:9px 0;cursor:pointer}.item b{font-size:12px}.item small{display:block;color:#8d9993;font-size:10px;margin-top:3px}.item strong{font-size:12px}.chips{display:flex;gap:6px;flex-wrap:wrap}.chip{border:1px solid #e2e8e4;border-radius:24px;padding:8px 11px;background:white;font-size:11px;cursor:pointer}.chip.on{background:#0a8074;color:white;border-color:#0a8074}.note{height:76px;resize:vertical}.note,.input{width:100%;padding:12px;font-family:inherit;font-size:12px;outline-color:#0e8175}.upload{display:flex;gap:10px;align-items:center;border:1px dashed #b1c9c0;border-radius:8px;padding:12px;font-size:11px;color:#286d61;cursor:pointer}.photo{background:#e7f1ed;padding:15px;border-radius:6px}.option{display:block;width:100%;text-align:left;padding:12px;margin:8px 0;font-size:12px;cursor:pointer}.option.active{background:#e6f2ee;border-color:#0a8074}.dot{display:inline-block;width:13px;height:13px;border:1px solid #a9c9c0;border-radius:50%;margin-right:7px;vertical-align:-2px}.option.active .dot{background:#0a8074;box-shadow:inset 0 0 0 3px #e6f2ee}.label{font-size:10px;text-transform:uppercase;font-weight:800;display:block;margin:15px 0 7px}.rows{border:1px solid #e4ebe6;border-radius:9px;overflow:hidden}.row{display:flex;justify-content:space-between;gap:13px;padding:12px;border-bottom:1px solid #e5ebe7;font-size:12px}.row:last-child{border:0}.row span{color:#7a8981}.row b{text-align:right}.total{background:#e3f1ec;font-weight:800}.discount b,.discount span{color:#078477}.check{border-radius:50%;background:#0a8074;color:white;font-size:25px;width:49px;height:49px;display:grid;place-items:center;margin:30px auto 14px}.center{text-align:center}.code{border:2px dashed #0e8175;padding:14px;text-align:center;font-size:20px;font-weight:900;color:#0a8074;letter-spacing:1px;border-radius:9px;margin:18px 0}.timeline{border-left:1px dashed #75ac9e;margin:20px 0 20px 12px;padding-left:19px}.milestone{position:relative;margin:0 0 22px;font-size:12px}.milestone:before{content:'○';position:absolute;left:-31px;top:-2px;color:#0a8074;font-size:21px;background:#fff}.milestone.done:before{content:'●'}.milestone small{display:block;color:#9aa7a0;font-size:10px;margin-top:4px}.rating{margin:12px 0}.rating label{font-size:11px;font-weight:800;display:block;margin-bottom:6px}.scale{display:flex;gap:5px}.scale button{flex:1;padding:9px 0;border:1px solid #e4eae6;background:white;border-radius:6px;cursor:pointer}.scale button.on{background:#0a8074;color:white}.legend{display:flex;justify-content:space-between;font-size:9px;color:#a3aea8}.footer{border-top:1px solid #eef1ee;background:white;padding:14px 22px 21px}.primary,.secondary{width:100%;padding:13px;border-radius:8px;font-size:12px;font-weight:800;cursor:pointer}.primary{background:#0a8074;border:1px solid #0a8074;color:white}.secondary{margin-top:8px;border:1px solid #0a8074;color:#0a8074;background:white}.hide{display:none}.disclaimer{text-align:center;font-size:10px;color:#abb5af;margin-top:14px}@media(min-width:700px){body{padding:35px 0}.app{min-height:800px;border-radius:18px;overflow:hidden}.main{min-height:590px}}
</style></head><body><div class="app"><header class="top"><div class="brand">Bersihinihh.</div><div class="count" id="count"></div></header><main id="main" class="main"></main><footer class="footer"><button class="primary" id="primary" onclick="advance()">Lanjut</button><button class="secondary hide" id="secondary" onclick="other()">Kembali</button><div class="disclaimer">Prototype akademik · tidak mengirim pesanan nyata</div></footer></div>
<script>
const s={p:0,service:'Cuci Sepatu',conditions:['Bau menyengat'],note:'',photo:'',handoff:'Asrama UNAI',time:'Sore 16.00–18.00',name:'',phone:'',status:0,pay:'Tunai',rating:[5,5,5,3],testimony:false};const el=id=>document.getElementById(id);const safe=v=>String(v).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));function go(n){s.p=n;render();window.scrollTo(0,0)}function back(){go(Math.max(0,s.p-1))}function heading(t){return '<div><button class="back" onclick="back()">‹</button><span class="screen-title">'+t+'</span></div>'}function choose(k,v){s[k]=v;render()}function toggle(v){s.conditions=s.conditions.includes(v)?s.conditions.filter(x=>x!==v):[...s.conditions,v];render()}function rate(i,n){s.rating[i]=n;render()}function rating(label,i){return '<div class="rating"><label>'+label+'</label><div class="scale">'+[1,2,3,4,5].map(n=>'<button class="'+(s.rating[i]===n?'on':'')+'" onclick="rate('+i+','+n+')">'+n+'</button>').join('')+'</div><div class="legend"><span>Kurang</span><span>Sangat baik</span></div></div>'}
function render(){const p=s.p;el('count').textContent='Purwarupa klik · '+(p+1)+'/7';let h='';el('secondary').classList.add('hide');el('primary').onclick=advance;el('primary').textContent=['Lihat pesanan saya','Lanjut','Lihat ringkasan','Kirim pesanan','Lihat status pesanan','Lanjut ke penilaian','Selesai'][p];
if(p===0)h='<h1 class="headline">Sepatu atau helm<br>mulai kotor?</h1><p class="muted">Deep cleaning untuk mahasiswa UNAI. Bayar per layanan, tanpa langganan.</p><div class="promo"><b>Pesanan pertama Rp25.000</b>Berlaku 2 minggu sejak promosi awal, hanya untuk transaksi pertama.</div><div class="section">Pilih layanan</div>'+['Cuci Sepatu','Cuci Helm'].map(v=>'<button class="item" onclick="s.service=\''+v+'\';go(1)"><span><b>'+v+'</b><small>Deep cleaning '+(v==='Cuci Sepatu'?'sepatu':'helm')+'</small></span><strong>Rp30.000 ›</strong></button>').join('');
if(p===1)h=heading(s.service)+'<div class="section">Kondisi barang (boleh pilih lebih dari satu)</div><div class="chips">'+['Kanvas','Kulit','Bau menyengat','Noda membandel','Sol menguning'].map(v=>'<button class="chip '+(s.conditions.includes(v)?'on':'')+'" onclick="toggle(\''+v+'\')">'+v+'</button>').join('')+'</div><div class="section">Catatan untuk tim</div><textarea class="note" id="note" placeholder="Contoh: Sol sebelah kiri mulai lepas">'+safe(s.note)+'</textarea><div class="section">Foto kondisi (opsional)</div><label class="upload"><span class="photo">Foto</span><span><b>Tambah foto kondisi</b><br><small>Dipakai sebagai catatan kondisi sebelum dicuci. Boleh dilewati.</small></span><input type="file" accept="image/*" style="display:none" onchange="s.photo=this.files[0]?.name||\'\';el(\'filename\').textContent=s.photo"></label><p id="filename" class="muted">'+safe(s.photo)+'</p>';
if(p===2)h=heading('Serah barang')+'<div class="section">Titik serah</div>'+['Asrama UNAI','Area kampus UNAI','Kos sekitar kampus'].map(v=>'<button class="option '+(s.handoff===v?'active':'')+'" onclick="choose(\'handoff\',\''+v+'\')"><span class="dot"></span>'+v+'</button>').join('')+'<div class="section">Waktu serah</div><div class="chips">'+['Pagi 08.00–10.00','Siang 12.00–14.00','Sore 16.00–18.00'].map(v=>'<button class="chip '+(s.time===v?'on':'')+'" onclick="choose(\'time\',\''+v+'\')">'+v+'</button>').join('')+'</div><label class="label">Nama</label><input id="name" class="input" placeholder="Nama kamu" value="'+safe(s.name)+'"><label class="label">Nomor WhatsApp</label><input id="phone" class="input" type="tel" placeholder="08xx-xxxx-xxxx" value="'+safe(s.phone)+'">';
if(p===3)h=heading('Ringkasan pesanan')+'<div class="rows">'+[['Layanan',s.service],['Serah di',s.handoff],['Waktu',s.time],['Harga normal','Rp30.000'],['Promo pesanan pertama*','−Rp5.000']].map((x,i)=>'<div class="row '+(i===4?'discount':'')+'"><span>'+x[0]+'</span><b>'+x[1]+'</b></div>').join('')+'<div class="row total"><span>Total estimasi*</span><b>Rp25.000</b></div></div><p class="info"><b>Bayar setelah selesai.</b> Tidak ada biaya di muka. Kamu membayar saat mengambil barang.</p><p class="muted">*Promo berlaku jika memenuhi syarat. Harga final dikonfirmasi tim.</p>';
if(p===4)h='<div class="center"><div class="check">✓</div><h1 class="headline">Pesanan terkirim</h1><p class="muted">Tim akan menghubungi lewat WhatsApp untuk memastikan waktu dan tempat serah.</p></div><div class="code">BRS-0042</div><div class="info">Kode contoh untuk pengujian. Tidak ada pesanan sungguhan yang dibuat.</div>';
if(p===5)h=heading('Status pesanan')+'<div class="rows"><div class="row"><span>Kode</span><b>BRS-0042</b></div><div class="row"><span>Layanan</span><b>'+s.service+'</b></div></div><div class="section">Perjalanan pesanan</div><div class="timeline">'+[['Diterima','Barang sudah kami terima'],['Dicuci','Sedang dalam proses deep cleaning'],['Siap diambil','Kabar masuk lewat WhatsApp']].map((v,i)=>'<div class="milestone '+(i<=s.status?'done':'')+'"><b>'+v[0]+'</b><small>'+v[1]+'</small></div>').join('')+'</div><div class="info">Untuk mencoba purwarupa: tahap pesanan berpindah lewat tombol ini (di produk jadi, tim yang memperbarui).</div><button class="secondary" onclick="s.status=(s.status+1)%3;render()">Simulasikan tahap berikutnya</button>';
if(p===6)h=heading('Bayar dan beri nilai')+'<div class="row total" style="border-radius:8px"><span>Total bayar*</span><b>Rp25.000</b></div><div class="section">Cara bayar</div><div class="chips">'+['Tunai','Transfer'].map(v=>'<button class="chip '+(s.pay===v?'on':'')+'" onclick="choose(\'pay\',\''+v+'\')">'+v+'</button>').join('')+'</div><div class="section">Nilai layanan (1 kurang, 5 sangat baik)</div>'+['Kebersihan hasil','Proses pemesanan','Waktu pengerjaan','Harga'].map((v,i)=>rating(v,i)).join('')+'<label style="display:flex;gap:9px;font-size:11px;margin:16px 0"><input type="checkbox" '+(s.testimony?'checked':'')+' onchange="s.testimony=this.checked">Boleh dipakai sebagai testimoni</label><p class="muted">*Contoh pelanggan pertama yang memenuhi syarat promo.</p>';
el('main').innerHTML=h;if(p===4){el('secondary').classList.remove('hide');el('secondary').textContent='Hubungi tim lewat WhatsApp'}if(p===6){el('secondary').classList.remove('hide');el('secondary').textContent='Kembali ke status'}}
function advance(){if(s.p===0)go(1);else if(s.p===1){s.note=el('note').value;go(2)}else if(s.p===2){const n=el('name').value.trim(),tel=el('phone').value.replace(/\D/g,'');if(!n||!/^08\d{8,11}$/.test(tel)){alert('Isi nama dan nomor WhatsApp Indonesia yang valid (08..., 10–13 digit).');return}s.name=n;s.phone=tel;go(3)}else if(s.p<6)go(s.p+1);else{el('main').innerHTML='<div class="center"><div class="check">✓</div><h1 class="headline">Terima kasih</h1><p class="muted">Penilaianmu membantu tim memperbaiki layanan.</p><div class="info">Penilaian ini tidak disimpan karena masih prototype.</div></div>';el('primary').textContent='Pesan lagi';el('primary').onclick=()=>{s.p=0;s.status=0;render()};el('secondary').classList.add('hide')}}
function other(){if(s.p===4)alert('Nomor WhatsApp bisnis belum disediakan. Ini hanya simulasi.');else back()}render();
</script></body></html>
