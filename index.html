<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#11100d"><title>Bersihinnih — BRH</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Playfair+Display:wght@600;700;800&display=swap');
:root{--bg:#10100e;--panel:#1b1a16;--line:#39362c;--gold:#d6b66c;--gold2:#f4dfaa;--text:#f6f2e9;--muted:#aaa79b}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% -20%,#4a3b1d 0,#171610 38%,var(--bg) 72%);color:var(--text);font-family:'DM Sans',sans-serif;min-height:100vh}.shell{max-width:1120px;margin:auto;padding:20px 24px 50px}.top{display:flex;align-items:center;justify-content:space-between;gap:16px;border-bottom:1px solid #ffffff20;padding-bottom:18px}.brand{display:flex;align-items:center;gap:12px}.mark{width:52px;height:52px;border:1px solid #b9954f;border-radius:13px;display:grid;place-items:center;background:linear-gradient(145deg,#fff8df,#d5b56d 25%,#72501d 53%,#f8e8b4 72%,#9c742f);color:#211a0d;font:800 24px 'Playfair Display';letter-spacing:-3px;text-shadow:0 1px 1px #fff9;box-shadow:0 8px 25px #0008,inset 0 1px 2px #fff}.brandname{font:700 23px 'Playfair Display'}.brandname span{color:var(--gold)}.tag{font-size:9px;color:var(--muted);letter-spacing:2px;text-transform:uppercase;margin-top:3px}.nav{display:flex;gap:7px;flex-wrap:wrap}.nav button,.secondary,.mini{border:1px solid var(--line);background:#ffffff08;color:var(--muted);padding:10px 14px;border-radius:999px;font-size:11px;cursor:pointer}.nav button.active{border-color:var(--gold);color:var(--gold2);background:#b9954f1a}.hero{padding:60px 0 38px;display:grid;grid-template-columns:1.2fr .8fr;gap:30px;align-items:center}.eyebrow{color:var(--gold);font-size:10px;letter-spacing:2.5px;text-transform:uppercase;font-weight:700}.hero h1{font:700 clamp(40px,6vw,68px)/1.02 'Playfair Display';letter-spacing:-2px;margin:14px 0}.hero h1 em{color:var(--gold2);font-style:normal}.lead,.muted{color:var(--muted);font-size:13px;line-height:1.8}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}.btn{border:0;border-radius:999px;padding:13px 19px;background:linear-gradient(135deg,#f2dfaa,#bb9148);color:#20190c;font-weight:800;font-size:11px;cursor:pointer}.btn.secondary{background:transparent;border:1px solid var(--line);color:var(--text)}.hero-card,.card,.panel{border:1px solid var(--line);background:linear-gradient(145deg,#25231b,#171714);border-radius:19px;padding:22px}.hero-card{border-color:#b9954f66;box-shadow:0 20px 60px #0006}.seal{width:66px;height:66px;border:1px solid var(--gold);border-radius:50%;display:grid;place-items:center;color:var(--gold2);font:700 24px 'Playfair Display';margin-bottom:20px}.hero-card h3{font:700 24px 'Playfair Display';margin:0 0 8px}.hero-card p,.card p{font-size:11px;color:var(--muted);line-height:1.7}.stats,.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:20px}.stat{border-top:1px solid #b9954f66;padding-top:10px}.stat b{display:block;color:var(--gold2);font:700 19px 'Playfair Display'}.stat small{color:var(--muted);font-size:9px}.sectionhead{display:flex;justify-content:space-between;align-items:end;margin:34px 0 14px;gap:12px}.sectionhead h2,.panel h2{font:700 26px 'Playfair Display';margin:6px 0}.sectionhead p{color:var(--muted);font-size:11px}.card h3{font-size:14px;margin:12px 0 5px}.icon{width:40px;height:40px;border:1px solid #b9954f66;border-radius:11px;display:grid;place-items:center;color:var(--gold2)}.price{font:700 20px 'Playfair Display';color:var(--gold2);margin:14px 0}.price small{font:400 9px 'DM Sans';color:var(--muted)}.promo{border:1px dashed #b9954f88;background:#b9954f0d;border-radius:14px;padding:17px;margin-top:16px;display:flex;justify-content:space-between;align-items:center;gap:12px}.promo b{color:var(--gold2)}.promo p{color:var(--muted);font-size:10px;margin:4px 0}.panel{margin-top:28px;padding:24px}.panel .muted{margin-top:0}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:13px}.field{display:flex;flex-direction:column;gap:7px}.field.full{grid-column:1/-1}.field label{font-size:9px;color:var(--gold2);letter-spacing:1px;text-transform:uppercase;font-weight:700}.field input,.field select,.field textarea{background:#11110f;color:var(--text);border:1px solid var(--line);border-radius:10px;padding:12px;font:12px 'DM Sans';outline:none}.field textarea{min-height:75px}.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--gold)}.summary{border:1px solid #b9954f55;background:#b9954f0c;border-radius:13px;padding:14px;margin-top:15px}.sum{display:flex;justify-content:space-between;padding:6px 0;color:var(--muted);font-size:11px}.sum strong{color:var(--text)}.sum.total{border-top:1px solid #b9954f55;margin-top:6px;padding-top:12px}.sum.total strong{color:var(--gold2);font:700 19px 'Playfair Display'}.notice{font-size:10px;color:var(--muted);line-height:1.6;margin-top:9px}.hidden{display:none!important}.tablewrap{overflow:auto}.table{width:100%;min-width:700px;border-collapse:collapse;font-size:10px}.table th{text-align:left;color:var(--gold2);padding:12px;border-bottom:1px solid var(--line);text-transform:uppercase;letter-spacing:1px}.table td{padding:12px;border-bottom:1px solid #ffffff12;color:var(--muted)}.table td strong{color:var(--text)}.table input,.table select{background:#11110f;color:var(--text);border:1px solid var(--line);padding:7px;border-radius:7px;width:120px;font-size:10px}.mini{padding:7px 9px;border-radius:7px;color:var(--gold2)}.pill{display:inline-block;border:1px solid #b9954f66;border-radius:20px;padding:5px 8px;color:var(--gold2);font-size:9px}.timeline{display:flex;margin:22px 0}.step{flex:1;border-top:2px solid var(--line);padding-top:10px;color:var(--muted);font-size:9px}.step.done{border-color:var(--gold);color:var(--gold2)}.footer{border-top:1px solid #ffffff20;margin-top:55px;padding-top:18px;display:flex;justify-content:space-between;color:var(--muted);font-size:9px}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#f2dfaa;color:#20190c;padding:12px 18px;border-radius:30px;font-size:11px;font-weight:700;box-shadow:0 8px 30px #0008}.empty{padding:22px;text-align:center;color:var(--muted)}@media(max-width:720px){.shell{padding:14px 15px 40px}.top{align-items:flex-start;flex-direction:column}.nav{width:100%}.nav button{flex:1;padding:9px 5px}.hero{grid-template-columns:1fr;padding:38px 0 25px}.grid,.stats{grid-template-columns:1fr}.formgrid{grid-template-columns:1fr}.field.full{grid-column:auto}.promo,.sectionhead,.footer{align-items:flex-start;flex-direction:column}.panel{padding:18px}}
</style></head><body><div class="shell"><header class="top"><div class="brand"><div class="mark">BRH</div><div><div class="brandname">Bersihin<span>nih.</span></div><div class="tag">Care, restored.</div></div></div><nav class="nav"><button class="active" data-view="home">Beranda</button><button data-view="booking">Booking</button><button data-view="tracking">Lacak pesanan</button><button data-view="admin">Admin demo</button></nav></header><main id="app"></main><footer class="footer"><span>© 2026 Bersihinnih · BRH</span><span>Purwarupa MVP · data tersimpan lokal di browser ini</span></footer></div><script>
const K='brh_orders_v1',C='brh_config_v1',DEF={shoe:30000,helmet:30000,discount:5000,promo:true,campaign:false,campaignPrice:30000};
let cfg=JSON.parse(localStorage.getItem(C)||'null')||Object.assign({},DEF),orders=JSON.parse(localStorage.getItem(K)||'[]'),view='home',service='shoe',pay='cash',lastCode='';
const statuses=['Booking masuk','Menunggu inspeksi','Menunggu persetujuan harga','Sedang dibersihkan','Siap diambil / dikirim','Selesai'];
const money=n=>'Rp'+Number(n||0).toLocaleString('id-ID');
const safe=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function save(){localStorage.setItem(K,JSON.stringify(orders));localStorage.setItem(C,JSON.stringify(cfg))}
function say(s){let t=document.getElementById('toast');if(!t){t=document.createElement('div');t.id='toast';t.className='toast';document.body.appendChild(t)}t.textContent=s;setTimeout(()=>t.remove(),2500)}
function go(v){view=v;document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.view===v));render()}
document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>go(b.dataset.view));
function base(s){return cfg.campaign?cfg.campaignPrice:cfg[s]}
function home(){return '<section class="hero"><div><div class="eyebrow">Premium care service · UNAI area</div><h1>Barang favoritmu,<br><em>layak dirawat.</em></h1><p class="lead">Perawatan sepatu dan helm dengan proses yang jelas. Booking dari website, serahkan barang dengan mudah, lalu pantau progresnya sampai selesai.</p><div class="actions"><button class="btn" onclick="go(\'booking\')">Booking layanan ↗</button><button class="btn secondary" onclick="go(\'tracking\')">Lacak pesanan</button></div></div><aside class="hero-card"><div class="seal">BRH</div><div class="eyebrow">Bersihinnih standard</div><h3>Clean with care.<br>Return with confidence.</h3><p>Mulai dari pemeriksaan kondisi, konfirmasi harga, proses cleaning, sampai barang siap kembali ke tanganmu.</p><div class="stats"><div class="stat"><b>02</b><small>Layanan utama</small></div><div class="stat"><b>01</b><small>Alur transparan</small></div><div class="stat"><b>100%</b><small>Care first</small></div></div></aside></section><div class="sectionhead"><div><div class="eyebrow">Our services</div><h2>Pilih perawatanmu</h2></div><p>Harga awal ditampilkan, harga final setelah inspeksi.</p></div><div class="grid"><article class="card"><div class="icon">✧</div><h3>Deep Cleaning Sepatu</h3><p>Pembersihan menyeluruh untuk membantu mengangkat kotoran dan merawat tampilan sepatu.</p><div class="price">'+money(base('shoe'))+' <small>/ estimasi awal</small></div><button class="mini" onclick="service=\'shoe\';go(\'booking\')">Pilih layanan →</button></article><article class="card"><div class="icon">◈</div><h3>Deep Cleaning Helm</h3><p>Perawatan bagian luar dan dalam helm dengan memperhatikan material dan kondisi barang.</p><div class="price">'+money(base('helmet'))+' <small>/ estimasi awal</small></div><button class="mini" onclick="service=\'helmet\';go(\'booking\')">Pilih layanan →</button></article><article class="card"><div class="icon">◇</div><h3>Inspection first</h3><p>Tim memeriksa kondisi barang terlebih dahulu. Biaya final dikonfirmasi sebelum pengerjaan.</p><div class="price">No surprise</div><span class="pill">Persetujuan pelanggan</span></article></div><div class="promo"><div><b>'+(cfg.promo?'Promo pelanggan baru':'Promo sedang tidak aktif')+'</b><p>'+(cfg.promo?'Potongan '+money(cfg.discount)+' untuk transaksi pertama.':'Pantau kembali untuk promo berikutnya.')+'</p></div><button class="btn secondary" onclick="go(\'booking\')">Gunakan promo</button></div><div class="sectionhead"><div><div class="eyebrow">Simple process</div><h2>Alur yang transparan</h2></div></div><div class="grid"><div class="card"><div class="eyebrow">01 / Book</div><h3>Booking online</h3><p>Pilih layanan, metode serah barang, dan jadwal yang kamu inginkan.</p></div><div class="card"><div class="eyebrow">02 / Inspect</div><h3>Inspeksi & konfirmasi</h3><p>Tim memeriksa kondisi barang dan mengirim harga final untuk disetujui.</p></div><div class="card"><div class="eyebrow">03 / Restore</div><h3>Proses & tracking</h3><p>Pantau status pengerjaan sampai barang siap diambil atau dikirim.</p></div></div>'}
function booking(){return '<section class="panel"><div class="eyebrow">Start your order</div><h2>Booking layanan</h2><p class="muted">Isi detail barang dan pilih cara serah. Harga di bawah merupakan estimasi awal; harga final dikonfirmasi setelah inspeksi.</p><form id="form"><div class="formgrid"><div class="field"><label>Nama lengkap</label><input name="name" required placeholder="Nama kamu"></div><div class="field"><label>Nomor WhatsApp</label><input name="phone" required placeholder="08xxxxxxxxxx" inputmode="tel"></div><div class="field"><label>Layanan</label><select name="service" id="service"><option value="shoe" '+(service==='shoe'?'selected':'')+'>Deep Cleaning Sepatu</option><option value="helmet" '+(service==='helmet'?'selected':'')+'>Deep Cleaning Helm</option></select></div><div class="field"><label>Metode serah barang</label><select name="fulfillment" id="fulfill" onchange="document.getElementById(\'addressbox\').classList.toggle(\'hidden\',this.value===\'dropoff\')"><option value="dropoff">Drop-off ke titik BRH</option><option value="pickup">Pickup / delivery</option></select></div><div class="field full hidden" id="addressbox"><label>Alamat pickup / delivery</label><input name="address" placeholder="Alamat lengkap dan patokan"></div><div class="field"><label>Tanggal serah</label><input name="date" type="date" required min="'+new Date().toISOString().slice(0,10)+'"></div><div class="field"><label>Waktu pilihan</label><select name="time"><option>Pagi (08.00–10.00)</option><option>Siang (12.00–14.00)</option><option>Sore (16.00–18.00)</option></select></div><div class="field"><label>Kondisi barang</label><select name="condition"><option>Normal / kotor ringan</option><option>Noda membandel</option><option>Bau menyengat</option><option>Material sensitif</option><option>Kerusakan / perhatian khusus</option></select></div><div class="field"><label>Foto kondisi (opsional)</label><input name="photo" type="file" accept="image/*"></div><div class="field full"><label>Catatan untuk tim</label><textarea name="notes" placeholder="Ceritakan kondisi khusus barangmu..."></textarea></div><div class="field full"><label>Metode pembayaran pilihan</label><select name="payment"><option value="cash">Bayar di tempat</option><option value="transfer">Transfer / QRIS (konfirmasi manual)</option></select></div></div><div class="summary"><div class="sum"><span>Estimasi layanan</span><strong id="est">'+money(base(service))+'</strong></div><div class="sum"><span>Promo pelanggan baru*</span><strong id="disc">−'+money(cfg.promo?cfg.discount:0)+'</strong></div><div class="sum total"><span>Estimasi total</span><strong id="total">'+money(Math.max(0,base(service)-(cfg.promo?cfg.discount:0)))+'</strong></div><p class="notice">*Promo pelanggan baru berlaku untuk transaksi pertama. Harga final menunggu inspeksi dan persetujuan. Pembayaran dilakukan setelah inspeksi / sesuai kesepakatan.</p></div><div class="actions"><button class="btn" type="submit">Kirim booking ↗</button><button class="btn secondary" type="button" onclick="go(\'home\')">Batal</button></div></form></section>'}
function track(){return '<section class="panel"><div class="eyebrow">Order status</div><h2>Lacak pesanan</h2><p class="muted">Masukkan kode booking untuk melihat status pesanan. Kode akan muncul setelah booking dibuat.</p><div class="formgrid"><div class="field"><label>Kode booking</label><input id="trackcode" placeholder="BRH-XXXXX" value="'+safe(lastCode)+'"></div><div class="field" style="justify-content:end"><button class="btn" onclick="findOrder()">Cari pesanan</button></div></div><div id="result"></div></section>'}
function admin(){return '<section class="panel"><div class="eyebrow">Operations workspace</div><h2>Admin & staff</h2><p class="muted">Dashboard demonstrasi untuk mengelola booking, inspeksi, harga, promo, dan progres.</p><p class="notice">Mode demo tanpa login/RBAC server. Data hanya tersimpan di browser ini. Jangan gunakan data pelanggan sungguhan.</p><div class="grid"><div class="card"><div class="eyebrow">Total orders</div><div class="price">'+orders.length+'</div></div><div class="card"><div class="eyebrow">In progress</div><div class="price">'+orders.filter(o=>o.status>0&&o.status<5).length+'</div></div><div class="card"><div class="eyebrow">Completed</div><div class="price">'+orders.filter(o=>o.status===5).length+'</div></div></div><div class="sectionhead"><div><div class="eyebrow">Order management</div><h2>Daftar pesanan</h2></div><button class="mini" onclick="exportCSV()">Export CSV</button></div><div class="tablewrap"><table class="table"><thead><tr><th>Kode / pelanggan</th><th>Layanan</th><th>Serah</th><th>Estimasi</th><th>Harga final</th><th>Status</th><th>Aksi</th></tr></thead><tbody>'+(orders.length?orders.map(o=>'<tr><td><strong>'+o.code+'</strong><br>'+safe(o.name)+'<br>'+safe(o.phone)+'</td><td>'+safe(o.serviceName)+'</td><td>'+(o.fulfillment==='dropoff'?'Drop-off':'Pickup')+'</td><td>'+money(o.estimate)+'</td><td><input id="price-'+o.code+'" type="number" min="0" placeholder="Harga final" value="'+(o.finalPrice===null?'':o.finalPrice)+'"></td><td><select id="status-'+o.code+'">'+statuses.map((s,i)=>'<option value="'+i+'" '+(o.status===i?'selected':'')+'>'+s+'</option>').join('')+'</select></td><td><button class="mini" onclick="saveOrder(\''+o.code+'\')">Simpan</button></td></tr>').join(''):'<tr><td colspan="7" class="empty">Belum ada pesanan. Buat booking dari menu Booking.</td></tr>')+'</tbody></table></div><div class="sectionhead"><div><div class="eyebrow">Pricing & promotion</div><h2>Atur harga dan promo</h2></div></div><div class="formgrid"><div class="field"><label>Harga sepatu (Rp)</label><input id="shoeprice" type="number" value="'+cfg.shoe+'"></div><div class="field"><label>Harga helm (Rp)</label><input id="helmetprice" type="number" value="'+cfg.helmet+'"></div><div class="field"><label>Potongan pelanggan baru (Rp)</label><input id="discount" type="number" value="'+cfg.discount+'"></div><div class="field"><label>Campaign harga global (Rp)</label><input id="campaignprice" type="number" value="'+cfg.campaignPrice+'"></div><div class="field"><label>Promo pelanggan baru</label><select id="promo"><option value="true" '+(cfg.promo?'selected':'')+'>Aktif</option><option value="false" '+(!cfg.promo?'selected':'')+'>Nonaktif</option></select></div><div class="field"><label>Campaign global</label><select id="campaign"><option value="false" '+(!cfg.campaign?'selected':'')+'>Nonaktif</option><option value="true" '+(cfg.campaign?'selected':'')+'>Aktif</option></select></div></div><div class="actions"><button class="btn" onclick="saveConfig()">Simpan konfigurasi</button><button class="btn secondary" onclick="resetDemo()">Reset data demo</button></div></section>'}
function render(){let app=document.getElementById('app');app.innerHTML=view==='home'?home():view==='booking'?booking():view==='tracking'?track():admin();if(view==='booking'){document.getElementById('service').onchange=function(){service=this.value;let d=cfg.promo?cfg.discount:0;document.getElementById('est').textContent=money(base(service));document.getElementById('disc').textContent='−'+money(d);document.getElementById('total').textContent=money(Math.max(0,base(service)-d))};document.getElementById('form').onsubmit=createOrder}if(view==='tracking'&&lastCode)findOrder()}
function createOrder(e){e.preventDefault();let f=new FormData(e.target),phone=String(f.get('phone')).replace(/\D/g,'');if(!/^08\d{8,11}$/.test(phone)){say('Periksa nomor WhatsApp: gunakan format 08xxxxxxxxxx.');return}let s=f.get('service'),first=!orders.some(o=>o.phone===phone),b=base(s),d=first&&cfg.promo?cfg.discount:0,code='BRH-'+Math.random().toString(36).slice(2,7).toUpperCase();let o={code:code,name:f.get('name'),phone:phone,service:s,serviceName:s==='shoe'?'Deep Cleaning Sepatu':'Deep Cleaning Helm',fulfillment:f.get('fulfillment'),address:f.get('address')||'',date:f.get('date'),time:f.get('time'),condition:f.get('condition'),photo:f.get('photo')?.name||'',notes:f.get('notes'),payment:f.get('payment'),estimate:Math.max(0,b-d),finalPrice:null,status:0,created:new Date().toISOString()};orders.unshift(o);save();lastCode=code;say('Booking tersimpan · '+code);go('tracking')}
function findOrder(){let code=(document.getElementById('trackcode')?.value||'').trim().toUpperCase(),o=orders.find(x=>x.code===code),r=document.getElementById('result');if(!r)return;if(!o){r.innerHTML='<div class="empty">Pesanan tidak ditemukan di browser ini.</div>';return}r.innerHTML='<div class="summary"><div class="sum"><span>Kode booking</span><strong>'+o.code+'</strong></div><div class="sum"><span>Layanan</span><strong>'+safe(o.serviceName)+'</strong></div><div class="sum"><span>Metode serah</span><strong>'+(o.fulfillment==='dropoff'?'Drop-off':'Pickup / delivery')+'</strong></div><div class="sum"><span>Estimasi awal</span><strong>'+money(o.estimate)+'</strong></div>'+(o.finalPrice!==null?'<div class="sum total"><span>Harga final</span><strong>'+money(o.finalPrice)+'</strong></div>':'')+'</div><div class="timeline">'+statuses.map((s,i)=>'<div class="step '+(i<=o.status?'done':'')+'">'+s+'</div>').join('')+'</div><p class="muted">'+(o.status===2?'Harga final menunggu persetujuan pelanggan. Hubungi tim untuk konfirmasi.':o.status===5?'Pesanan selesai. Terima kasih telah mempercayakan perawatan kepada BRH.':'Status terakhir: '+statuses[o.status]+'.')+'</p>'}
function saveOrder(code){let o=orders.find(x=>x.code===code);if(!o)return;let p=document.getElementById('price-'+code).value,s=Number(document.getElementById('status-'+code).value);o.finalPrice=p===''?null:Math.max(0,Number(p));o.status=s;save();say('Pesanan diperbarui.');render()}
function saveConfig(){cfg={shoe:Math.max(0,Number(document.getElementById('shoeprice').value)),helmet:Math.max(0,Number(document.getElementById('helmetprice').value)),discount:Math.max(0,Number(document.getElementById('discount').value)),campaignPrice:Math.max(0,Number(document.getElementById('campaignprice').value)),promo:document.getElementById('promo').value==='true',campaign:document.getElementById('campaign').value==='true'};save();say('Harga dan promo tersimpan.');render()}
function exportCSV(){let rows=[['Kode','Nama','WhatsApp','Layanan','Fulfillment','Alamat','Tanggal','Estimasi','Harga final','Status'],...orders.map(o=>[o.code,o.name,o.phone,o.serviceName,o.fulfillment,o.address,o.date,o.estimate,o.finalPrice??'',statuses[o.status]])];let csv=rows.map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\n'),a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='bersihinnih-orders.csv';a.click();URL.revokeObjectURL(a.href)}
function resetDemo(){if(!confirm('Hapus semua pesanan dan reset konfigurasi demo?'))return;orders=[];cfg=Object.assign({},DEF);save();say('Data demo direset.');render()}
render();
</script></body></html>
